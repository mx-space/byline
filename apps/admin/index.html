<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      ;(function () {
        var mode = 'system'
        try {
          var raw = localStorage.getItem('theme-mode')
          if (raw) {
            var stripped = raw.replace(/^"|"$/g, '')
            if (
              stripped === 'dark' ||
              stripped === 'light' ||
              stripped === 'system'
            ) {
              mode = stripped
            } else {
              var parsed = JSON.parse(raw)
              if (parsed && parsed.state && parsed.state.themeMode) {
                mode = parsed.state.themeMode
              }
            }
          }
        } catch (e) {}
        var dark =
          mode === 'dark' ||
          (mode !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        var appearance = dark ? 'dark' : 'light'
        document.documentElement.setAttribute('data-theme', appearance)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = appearance
      })()
    </script>

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover"
    />
    <link
      rel="icon"
      type="image/png"
      href="/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="Byline" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Byline</title>
    <meta
      name="description"
      content="A slim, multi-author, AI-native headless CMS."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Byline" />
    <meta
      property="og:description"
      content="A slim, multi-author, AI-native headless CMS."
    />
    <meta property="og:image" content="og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1800" />
    <meta property="og:image:height" content="945" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Byline" />
    <meta
      name="twitter:description"
      content="A slim, multi-author, AI-native headless CMS."
    />
    <meta name="twitter:image" content="og.png" />
    <script>
      window.injectData = {}
      window.version = 'N/A'
      window.pageSource = 'self'
    </script>
    <!-- ENV INJECT -->
    <!-- ADMIN VERSION INJECT -->
    <!-- injectable script -->
  </head>

  <body>
    <div id="app">
      <!-- Initial Loading State -->
      <div id="initial-loader">
        <div class="loader-content">
          <div class="loader-spinner">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 12a9 9 0 1 1-6.219-8.56" />
            </svg>
          </div>
        </div>
      </div>
      <style>
        #initial-loader {
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          background-color: #ffffff;
          transition: opacity 0.2s ease-out;
          z-index: 9999;
        }
        .dark #initial-loader {
          background-color: #0a0a0a;
        }
        .loader-content {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 16px;
        }
        .loader-spinner {
          width: 32px;
          height: 32px;
          color: #171717;
          animation: spin 1s linear infinite;
        }
        .dark .loader-spinner {
          color: #ededed;
        }
        .loader-spinner svg {
          width: 100%;
          height: 100%;
        }

        .dark .loader-text {
          color: #a3a3a3;
        }
        @keyframes spin {
          from {
            transform: rotate(0deg);
          }
          to {
            transform: rotate(360deg);
          }
        }
        #initial-loader.fade-out {
          opacity: 0;
          pointer-events: none;
        }
      </style>
    </div>
    <noscript>
      <strong
        >We're sorry but Byline doesn't work properly without JavaScript
        enabled. Please enable it to continue.</strong
      >
      <strong>
        It may be a network problem that caused the failure to load the JS file.
      </strong>
    </noscript>
    <script>
      // Initialize theme before the application loads to prevent flash
      ;(function () {
        var themeMode = localStorage.getItem('theme-mode')
        // Remove quotes if stored as JSON string
        if (themeMode) {
          themeMode = themeMode.replace(/^"|"$/g, '')
        }
        var isDark = false
        if (themeMode === 'dark') {
          isDark = true
        } else if (themeMode === 'system' || !themeMode) {
          isDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        }
        if (isDark) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
    <script>
      // Seed sidebar width from localStorage before React mounts to avoid first-paint flash.
      ;(function () {
        try {
          var c = JSON.parse(
            localStorage.getItem('admin:sidebar-collapsed') || 'false',
          )
          var w = JSON.parse(
            localStorage.getItem('admin:sidebar-width') || '240',
          )
          var px = typeof w === 'number' && w >= 200 && w <= 360 ? w : 240
          document.documentElement.style.setProperty(
            '--sidebar-width',
            c ? '0px' : px + 'px',
          )
        } catch (_) {
          document.documentElement.style.setProperty('--sidebar-width', '240px')
        }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
