on:
  push:
    tags-ignore:
      - 'v*'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
    branches:
      - main
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node
        with:
          node-version: '26.x'
      - name: Check controller response envelope
        run: pnpm run check:controller-response-envelope
      - name: Check validate:false is paired with a check
        run: pnpm run check:validate-false-paired
      - name: Typecheck (server)
        run: pnpm -C apps/server run typecheck
      - name: Typecheck (admin)
        run: pnpm -C apps/admin run typecheck
      - name: Typecheck (packages)
        run: pnpm --filter "./packages/*" run typecheck
      - name: Lint (server)
        run: pnpm -C apps/server run lint
      - name: Lint (admin)
        run: pnpm -C apps/admin run lint
      - name: Lint (packages)
        run: pnpm --filter "./packages/*" run lint
      - name: Lint migrations (expand-contract guard)
        run: pnpm -C apps/server run lint:migrations

  server-test:
    name: Server tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mx
          POSTGRES_PASSWORD: mx
          POSTGRES_DB: byline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mx -d byline_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node
        with:
          node-version: '26.x'
      - name: Install Redis Server
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
      - name: Run tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        run: pnpm -C apps/server exec vitest run --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          NODE_ENV: development
          CI: true
          REDIS_BINARY_PATH: /usr/bin/redis-server
          REDISMS_SYSTEM_BINARY: /usr/bin/redis-server
          SNOWFLAKE_WORKER_ID: 1
          PG_VERIFY_URL: postgres://mx:mx@127.0.0.1:5432/byline_test
          PG_URL: postgres://mx:mx@127.0.0.1:5432/byline_test
          PG_CONNECTION_STRING: postgres://mx:mx@127.0.0.1:5432/byline_test
          PG_HOST: 127.0.0.1
          PG_PORT: 5432
          PG_USER: mx
          PG_PASSWORD: mx
          PG_DATABASE: byline_test

  admin-test:
    name: Admin tests
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node
        with:
          node-version: '26.x'
      - name: Run tests
        run: pnpm -C apps/admin run test
        env:
          CI: true

  packages:
    name: Packages (test & build)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node
        with:
          node-version: '26.x'
      - name: Test
        run: pnpm --filter "./packages/*" run test
        env:
          CI: true
      - name: Build
        run: pnpm --filter "./packages/*" run build
